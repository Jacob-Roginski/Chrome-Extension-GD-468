<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terms Lens</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f5f7f2;
        --muted: #9ca69f;
        --line: #303936;
        --paper: #111513;
        --panel: #191e1c;
        --accent: #f1f1ed;
        --accent-muted: #b9bdb9;
        --warning: #d5d7d2;
      }

      body {
        margin: 0;
        width: 360px;
        background: var(--paper);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      header {
        position: relative;
        overflow: hidden;
        padding: 20px 21px 18px;
        background: #1b211e;
        border-bottom: 1px solid var(--line);
      }

      header::after {
        position: absolute;
        right: -34px;
        bottom: -58px;
        width: 150px;
        height: 150px;
        border: 20px solid var(--accent);
        border-radius: 50%;
        opacity: 0.12;
        content: "";
      }

      .eyebrow {
        margin: 0 0 9px;
        color: var(--accent);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 29px;
        line-height: 0.95;
        letter-spacing: -1.2px;
        text-transform: uppercase;
      }

      #site {
        margin: 10px 0 0;
        max-width: 300px;
        overflow: hidden;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      main { padding: 18px 20px 20px; }

      .state { color: var(--muted); font-size: 12px; line-height: 1.5; }

      .summary {
        display: flex;
        align-items: center;
        gap: 13px;
        margin: -2px 0 18px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .score {
        display: grid;
        width: 62px;
        height: 62px;
        flex: 0 0 62px;
        place-items: center;
        border: 2px solid var(--warning);
        border-radius: 50%;
        background: #292b29;
        color: var(--warning);
        font-size: 25px;
        font-weight: 850;
      }

      .score small { display: block; margin-top: -19px; font-size: 8px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
      .summary strong { display: block; margin-bottom: 5px; font-size: 15px; letter-spacing: -0.2px; text-transform: uppercase; }
      .summary span { color: var(--muted); font-size: 11px; }

      .concern {
        margin: 8px 0;
        padding: 12px 13px;
        border: 1px solid #414542;
        border-left: 4px solid var(--warning);
        border-radius: 5px;
        background: #242725;
      }

      .concern:last-child { border-bottom: 1px solid #414542; }
      .concern strong { display: block; margin-bottom: 4px; color: var(--accent); font-size: 12px; font-weight: 850; letter-spacing: 0.3px; text-transform: uppercase; }
      .concern p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.45; }

      .actions { display: flex; gap: 8px; margin-top: 17px; }
      button {
        flex: 1;
        padding: 11px 12px;
        border: 1px solid #46504b;
        border-radius: 5px;
        background: #222825;
        color: var(--ink);
        cursor: pointer;
        font-size: 11px;
        font-weight: 850;
        letter-spacing: 0.6px;
        text-transform: uppercase;
      }
      button.primary { border-color: var(--accent); background: var(--accent); color: #171918; }
      button:hover { filter: brightness(0.96); }
      a { color: var(--accent-muted); font-size: 11px; font-weight: 800; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <header>
      <p class="eyebrow">Private, local review</p>
      <h1>Terms Lens</h1>
      <p id="site">Checking this page...</p>
    </header>
    <main>
      <div id="content" class="state">Automatically finding this site's Terms...</div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
