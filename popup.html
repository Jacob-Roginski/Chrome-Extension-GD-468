<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terms Lens</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #16211f;
        --muted: #68736f;
        --line: #dce5df;
        --paper: #fbfcf9;
        --mint: #d9f1df;
        --green: #216a4d;
        --amber: #c16b2d;
      }

      body {
        margin: 0;
        width: 350px;
        background: var(--paper);
        color: var(--ink);
        font-family: Georgia, 'Times New Roman', serif;
      }

      header {
        padding: 18px 20px 16px;
        background: var(--mint);
        border-bottom: 1px solid #c4dfcc;
      }

      .eyebrow {
        margin: 0 0 5px;
        color: var(--green);
        font: 700 10px/1.2 Arial, sans-serif;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 25px;
        line-height: 1;
        letter-spacing: -0.4px;
      }

      #site {
        margin: 7px 0 0;
        max-width: 300px;
        overflow: hidden;
        color: #527064;
        font: 12px Arial, sans-serif;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      main { padding: 16px 20px 20px; }

      .state { color: var(--muted); font: 13px/1.45 Arial, sans-serif; }

      .site-form {
        display: flex;
        gap: 7px;
        margin-bottom: 16px;
      }

      .site-form label {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      .site-form input {
        min-width: 0;
        flex: 1;
        padding: 9px 10px;
        border: 1px solid var(--line);
        border-radius: 4px;
        color: var(--ink);
        font: 12px Arial, sans-serif;
      }

      .site-form input:focus {
        border-color: var(--green);
        outline: 2px solid #cbe7d3;
      }

      .summary {
        display: flex;
        align-items: center;
        gap: 13px;
        margin-bottom: 16px;
      }

      .score {
        display: grid;
        width: 58px;
        height: 58px;
        flex: 0 0 58px;
        place-items: center;
        border: 1px solid #b8d4c0;
        border-radius: 50%;
        background: #eff8f0;
        color: var(--green);
        font: 700 23px Arial, sans-serif;
      }

      .score small { display: block; margin-top: -18px; font-size: 9px; font-weight: 400; }
      .summary strong { display: block; margin-bottom: 4px; font-size: 17px; }
      .summary span { color: var(--muted); font: 12px Arial, sans-serif; }

      .concern {
        padding: 11px 0 11px 13px;
        border-left: 3px solid var(--amber);
        border-bottom: 1px solid var(--line);
      }

      .concern:last-child { border-bottom: 0; }
      .concern strong { display: block; margin-bottom: 3px; font-size: 14px; }
      .concern p { margin: 0; color: var(--muted); font: 12px/1.4 Arial, sans-serif; }

      .actions { display: flex; gap: 8px; margin-top: 15px; }
      button {
        flex: 1;
        padding: 10px 12px;
        border: 1px solid #b7cec0;
        border-radius: 4px;
        background: white;
        color: var(--green);
        cursor: pointer;
        font: 700 12px Arial, sans-serif;
      }
      button.primary { border-color: var(--green); background: var(--green); color: white; }
      button:hover { filter: brightness(0.96); }
      a { color: var(--green); font: 700 12px Arial, sans-serif; }
    </style>
  </head>
  <body>
    <header>
      <p class="eyebrow">Private, local review</p>
      <h1>Terms Lens</h1>
      <p id="site">Checking this page...</p>
    </header>
    <main>
      <form id="site-form" class="site-form">
        <label for="site-url">Site URL to test</label>
        <input id="site-url" type="url" placeholder="https://example.com" autocomplete="url" required />
        <button class="primary" type="submit">Test site</button>
      </form>
      <p id="form-state" class="state" hidden></p>
      <div id="content" class="state">Looking for a Terms of Service link...</div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
