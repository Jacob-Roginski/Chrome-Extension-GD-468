<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinePrint</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f3f0ee;
        --panel: #f7f5f3;
        --header: #f5f3f1;
        --ink: #1a1f25;
        --muted: #565f5b;
        --line: #d6d0cb;
        --accent: #ef6a6d;
        --accent-dark: #1c252b;
        --button: #1f2428;
        --button-text: #f5f3f1;
        --secondary: #ece8e4;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        width: 380px;
        background: var(--paper);
        color: var(--ink);
        font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif;
        letter-spacing: -0.02em;
      }

      header {
        position: relative;
        overflow: hidden;
        padding: 18px 22px 16px;
        background: var(--header);
        border-bottom: 1px solid var(--line);
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 62px;
        line-height: 0.95;
        letter-spacing: -0.03em;
        font-weight: 900;
        text-transform: none;
      }

      #site {
        margin: 10px 0 0;
        max-width: 300px;
        overflow: hidden;
        color: var(--muted);
        font-size: 20px;
        font-weight: 500;
        line-height: 1.2;
        letter-spacing: 0.01em;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      main { padding: 0 22px 18px; }

      .state {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
      }

      .summary-panel {
        display: flex;
        align-items: flex-start;
        gap: 16px;
        padding: 16px 0 18px;
        border-bottom: 1px solid var(--line);
      }

      .score {
        min-width: 82px;
        color: var(--accent);
        font-size: 72px;
        line-height: 0.8;
        letter-spacing: -0.09em;
        font-weight: 900;
        transform: translateY(-6px);
      }

      .summary-copy {
        flex: 1;
      }

      .summary-copy h2 {
        margin: 0;
        color: var(--ink);
        font-size: 22px;
        line-height: 1.1;
        letter-spacing: -0.01em;
        font-weight: 900;
        text-transform: uppercase;
      }

      .summary-copy p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.35;
        letter-spacing: 0;
      }

      .section-label {
        margin: 16px 0 0;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .findings {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .finding {
        padding: 20px 0 18px;
        border-bottom: 1px solid var(--line);
      }

      .finding h3 {
        margin: 0;
        color: var(--ink);
        font-size: 28px;
        line-height: 1.12;
        letter-spacing: -0.01em;
        font-weight: 900;
      }

      .finding p {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.42;
        letter-spacing: 0;
      }

      .terms-notice {
        margin-top: 18px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.45;
      }

      .terms-link {
        display: inline-block;
        margin-top: 8px;
        color: var(--ink);
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
      }

      .actions {
        display: flex;
        gap: 12px;
        margin-top: 20px;
      }

      button {
        flex: 1;
        padding: 16px 12px;
        border: 1px solid #2f363d;
        border-radius: 12px;
        background: transparent;
        color: var(--ink);
        cursor: pointer;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -0.04em;
      }

      button.primary {
        border-color: var(--button);
        background: var(--button);
        color: var(--button-text);
      }

      button:hover { filter: brightness(0.98); }
    </style>
  </head>
  <body>
    <header>
      <p class="eyebrow">Private, local review</p>
      <h1>FinePrint</h1>
      <p id="site">Checking this page...</p>
    </header>
    <main>
      <div id="content" class="state">Automatically finding this site's Terms...</div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
